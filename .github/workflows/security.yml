name: Security checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify syntax
        run: python -m compileall -q MCP_Server AbletonMCP_Remote_Script tools tests

      - name: Run security regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify core dependency hashes
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Audit locked dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.lock

      - name: Verify package metadata without resolving new dependencies
        run: python -m pip install --no-deps .
