[project]
name = "ableton-mcp-pro"
version = "1.0.0"
description = "Full control of Ableton Live through AI assistants via the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "nicholasbien"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]==1.30.0",
]

[project.optional-dependencies]
ai = [
    "midigenai @ git+https://github.com/nicholasbien/midigenai@a015526d742743d47bb9b87ff2f5f302f58314e0",
    "torch==2.14.0",
    "miditok==3.0.6.post1",
    "symusic==0.6.0",
    "huggingface_hub==1.31.0",
    "einops==0.8.2",
    "tqdm==4.70.0",
]

[project.scripts]
ableton-mcp-pro = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server"]

[project.urls]
"Homepage" = "https://github.com/nicholasbien/ableton-mcp-pro"
"Bug Tracker" = "https://github.com/nicholasbien/ableton-mcp-pro/issues"
